name: Build Ortenzya 64K trial (reuse GGUF layers)
on:
  push:
    branches:
      - ortenzya-64k-trial-20261106
    paths:
      - Dockerfile.64k
      - start-ortenzya-64k.sh
      - .github/workflows/build-64k.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ortenzya-64k-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated trial branch
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish 64K trial using the original baked model layers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.64k
          push: true
          pull: true
          platforms: linux/amd64
          tags: ghcr.io/haruzio825-design/honmaru-ortenzya:trial-q4km-64k-20261106
          provenance: false
